[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "countercurrent-nn"
version = "0.1.0"
description = "Two-sweep counterflow CNN with endogenous target-boundary inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
include = ["countercurrent_nn*"]

[tool.setuptools.package-data]
countercurrent_nn = ["configs/*.yaml"]
