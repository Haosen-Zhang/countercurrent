experiment: cifar10_bvp_countercurrent_p0
dataset:
  name: cifar10
  root: dataset
  download: false
  val_size: 5000
  split_seed: 0
  num_workers: 4
  pin_memory: true
model:
  name: inv_bvp_countercurrent
  in_channels: 3
  channels: 64
  depth: 4
  solve_steps: 8
  num_classes: 10
  num_groups: 8
  residual_scale: 0.1
  boundary_type: input_conditional
  prototype_dim: 64
  lattice_size: 8
  conductance_max: 0.49
  conductance_init_logit: -2.2
  damping: 1.0
  tol: 0.001
  truncate_steps: 4
  diagnostic_stride: 1
  boundary_initial_alpha: 0.1
  flow: independent
  reverse_beta: 0.1
  inverse_steps: 15
training:
  optimizer: sgd
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  batch_size: 128
  epochs: 200
  warmup_epochs: 5
  amp: false
  initial_loss_weight: 0.0
  conductance_weight_decay: 0.0
runtime:
  seed: 0
  device: auto
  deterministic: false
  output_dir: countercurrent_nn/results/cifar10_bvp_countercurrent_p0_seed0
diagnostics:
  max_samples: 16
