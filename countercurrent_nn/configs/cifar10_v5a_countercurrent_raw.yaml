experiment: cifar10_v5a_countercurrent_raw
dataset:
  name: cifar10
  root: dataset
  download: false
  val_size: 5000
  split_seed: 0
  num_workers: 4
  pin_memory: true
model:
  name: persistent_canonical_countercurrent
  in_channels: 3
  channels: 64
  depth: 4
  num_classes: 10
  num_groups: 8
  residual_scale: 0.1
  train_inner_steps: 8
  eval_max_steps: 24
  num_outer_train: 1
  num_outer_eval: 1
  tolerance: 0.001
  damping: 0.5
  conductance_max: 0.49
  conductance_init_logit: -2.2
  class_rank: 16
  lattice_size: 8
  boundary_base_scale: 0.15
  boundary_class_scale: 1.0
  boundary_instance_scale: 0.1
  boundary_target_rms: 0.55
  use_canonical_exchange: false
  match_canonical_compute: true
training:
  optimizer: sgd
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  batch_size: 128
  epochs: 200
  warmup_epochs: 5
  amp: false
  initial_loss_weight: 0.0
  conductance_weight_decay: 0.0
  boundary_scalar_weight_decay: 0.0
runtime:
  seed: 0
  device: auto
  deterministic: false
  output_dir: countercurrent_nn/results/cifar10_v5a_countercurrent_raw_seed0
diagnostics:
  max_samples: 16
  each_epoch: true
